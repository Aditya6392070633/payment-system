spring:
  application:
    name: payment-system
  profiles:
    active: dev

  # Default (dev) profile: H2 in-memory DB so the project runs with zero external infra.
  datasource:
    url: jdbc:h2:mem:paymentdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always

  h2:
    console:
      enabled: true
      path: /h2-console

  data:
    redis:
      host: localhost
      port: 6379

payment:
  author: "Deepak Singh Rajput"
  event-bus: in-memory      # switch to 'kafka' in application-prod.yml
  idempotency:
    ttl-seconds: 86400
  fraud:
    high-risk-amount-threshold: 200000     # in minor units (e.g. paise/cents)
    velocity-window-minutes: 10
    velocity-max-transactions: 5
    block-score-threshold: 80
    review-score-threshold: 50
  compliance:
    aml-daily-limit: 1000000
    kyc-required-above: 50000
  crypto:
    secret-key: "CHANGE_ME_32_BYTE_DEV_ONLY_KEY!"   # replace via env var / Vault in prod

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  health:
    redis:
      enabled: false
springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.deepaksinghrajput.payment: INFO
